name: ChatOps

on:
  issue_comment:
    types: [created]

jobs:
  parse-command:
    if: github.event.issue.pull_request != null && (contains(github.event.comment.body, '/plan') || contains(github.event.comment.body, '/apply'))
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      approved: ${{ steps.review.outputs.approved }}
      allowed: ${{ steps.perm.outputs.allowed }}
    steps:
      - name: Verifica permissão de quem comentou
        id: perm
        run: |
          assoc="${{ github.event.comment.author_association }}"
          if [[ "$assoc" == "OWNER" || "$assoc" == "COLLABORATOR" || "$assoc" == "MEMBER" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Identifica o comando
        id: parse
        run: |
          body="${{ github.event.comment.body }}"
          if [[ "$body" == *"/apply"* ]]; then
            echo "command=apply" >> "$GITHUB_OUTPUT"
          elif [[ "$body" == *"/plan"* ]]; then
            echo "command=plan" >> "$GITHUB_OUTPUT"
          fi

      - name: Reagir ao comentário (confirma recebimento)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Buscar dados do PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('number', context.issue.number);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('base_ref', pr.data.base.ref);

      - name: Checar se o PR está aprovado (necessário só para /apply)
        id: review
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const approved = reviews.data.some(r => r.state === 'APPROVED');
            core.setOutput('approved', approved ? 'true' : 'false');

      - name: Bloquear se sem permissão
        if: steps.perm.outputs.allowed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🚫 Você não tem permissão para rodar comandos de infraestrutura neste PR.'
            });
            core.setFailed('Sem permissão');

  detect-layers:
    needs: parse-command
    if: needs.parse-command.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse-command.outputs.head_sha }}
          fetch-depth: 0

      - id: detect
        run: |
          git fetch origin ${{ needs.parse-command.outputs.base_ref }}
          LAYERS=$(git diff --name-only origin/${{ needs.parse-command.outputs.base_ref }}...${{ needs.parse-command.outputs.head_sha }} -- 'layer/*/*' \
            | grep -oE '^layer/[^/]+/[^/]+' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "layers=$LAYERS" >> "$GITHUB_OUTPUT"

  plan:
    needs: [parse-command, detect-layers]
    if: needs.parse-command.outputs.command == 'plan' && needs.parse-command.outputs.allowed == 'true' && needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    environment: teste-hub
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJson(needs.detect-layers.outputs.layers) }}
    permissions:
      pull-requests: write
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse-command.outputs.head_sha }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Tofu Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: tofu init

      - name: Tofu Plan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          tofu plan -no-color 2>&1 | tee plan_output.txt

      - name: Comentar resultado no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '(sem saída)';
            try {
              plan = fs.readFileSync('${{ matrix.layer }}/plan_output.txt', 'utf8').slice(-60000);
            } catch (e) {}
            const body = `### 📋 \`/plan\` — \`${{ matrix.layer }}\`\n\n<details><summary>Ver plan completo</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.parse-command.outputs.pr_number }},
              body
            });

  apply-blocked:
    needs: parse-command
    if: needs.parse-command.outputs.command == 'apply' && needs.parse-command.outputs.allowed == 'true' && needs.parse-command.outputs.approved != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.parse-command.outputs.pr_number }},
              body: '⛔ Este PR ainda não tem uma aprovação (Review → Approve). Aprove antes de rodar `/apply`.'
            });

  apply:
    needs: [parse-command, detect-layers]
    if: needs.parse-command.outputs.command == 'apply' && needs.parse-command.outputs.allowed == 'true' && needs.parse-command.outputs.approved == 'true' && needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    environment: teste-hub
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJson(needs.detect-layers.outputs.layers) }}
    permissions:
      pull-requests: write
      contents: read
    defaults:
      run:
        working-directory: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse-command.outputs.head_sha }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Tofu Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: tofu init

      - name: Tofu Apply
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          tofu apply -auto-approve -no-color 2>&1 | tee apply_output.txt

      - name: Extrair resumo do apply
        if: always()
        working-directory: ${{ matrix.layer }}
        run: |
          grep -E "Apply complete|Error" apply_output.txt > apply_summary.txt || echo "Ver log completo" > apply_summary.txt

      - name: Comentar resultado no PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '(sem saída)';
            try {
              summary = fs.readFileSync('${{ matrix.layer }}/apply_summary.txt', 'utf8');
            } catch (e) {}
            const body = `### 🚀 \`/apply\` — \`${{ matrix.layer }}\`\n\n${summary}\n\nAplicado por @${{ github.event.comment.user.login }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.parse-command.outputs.pr_number }},
              body
            });