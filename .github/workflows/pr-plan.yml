name: PR Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'layer/**'

jobs:
  detect-layers:
    runs-on: ubuntu-latest
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          git fetch origin ${{ github.base_ref }}
          LAYERS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'layer/*/*' \
            | grep -oE '^layer/[^/]+/[^/]+' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Layers alteradas: $LAYERS"
          echo "layers=$LAYERS" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-layers
    if: needs.detect-layers.outputs.layers != '[]'
    runs-on: ubuntu-latest
    environment: teste-hub
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJson(needs.detect-layers.outputs.layers) }}
    defaults:
      run:
        working-directory: ${{ matrix.layer }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Tofu Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: tofu init

      - name: Tofu Validate
        run: tofu validate

      - name: Tofu Plan
        id: plan
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set +e
          tofu plan -no-color 2>&1 | tee plan_output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit $exit_code

      - name: Check for deprecation warnings
        if: always()
        working-directory: ${{ matrix.layer }}
        run: |
          if grep -qi "deprecat" plan_output.txt; then
            echo "has_deprecation=true" >> "$GITHUB_ENV"
            echo "::warning::Avisos de depreciação encontrados na layer ${{ matrix.layer }}"
          else
            echo "has_deprecation=false" >> "$GITHUB_ENV"
          fi

      - name: Comment PR with plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.layer }}/plan_output.txt';
            let plan = '(sem saída)';
            try {
              plan = fs.readFileSync(path, 'utf8');
              if (plan.length > 60000) {
                plan = plan.slice(-60000);
              }
            } catch (e) {}

            const deprecationNote = process.env.has_deprecation === 'true'
              ? '\n\n⚠️ **Avisos de depreciação encontrados** — revise o log antes de aprovar o merge.'
              : '';

            const body = `### 📋 Plan: \`${{ matrix.layer }}\`${deprecationNote}\n\n<details><summary>Ver plan completo</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });